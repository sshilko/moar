---
layout: default
id: index
---

<div class="posts">
  {% for post in site.posts %}
    <article class="post">    
      
      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="entry">
        {% if post.excerpt %}
            {{ post.excerpt }}
        {% else %}        
            {{ post.content | truncatewords:30}}
        {% endif %}
      </div>
      
      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">read moar</a>
    </article>
  {% endfor %}
</div>
